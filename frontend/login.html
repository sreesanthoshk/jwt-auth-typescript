<!DOCTYPE html>

<html>

<head>

  <title>
    Login
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="login-container">

    <h1>
      Project Management
    </h1>

    <input
      type="email"
      id="email"
      placeholder="Enter Email"
    />

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    />

    <button
      class="login-btn"
      onclick="login()"
    >

      Login

    </button>

  </div>

  <script src="app.js"></script>

</body>

</html>
